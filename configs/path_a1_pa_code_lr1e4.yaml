# =============================================================================
# path_a1_pa_code_lr1e4.yaml -- PA-CODE rerun with halved peak LR  2026-05-01
#
# Original PA-CODE run (path_a1_pa_code.yaml) killed at ep5 due to sustained
# val_dice_3d oscillation across 4 epochs at peak LR 2e-4:
#   ep0 0.1961  ep1 0.2232  ep2 0.0915  ep3 0.2082  ep4 0.1354  ep5 0.1646
# Train loss healthy and monotonically dropping (0.84 -> 0.79). Pattern is
# LR-induced FiLM-head oscillation, not transient warmup overshoot. Encoder
# unfreeze at ep5 did not rescue stability -- confirms FiLM dynamics, not
# encoder, is the bottleneck.
#
# This config: SINGLE-AXIS change. peak LR 2.0e-4 -> 1.0e-4 (halved).
# Everything else identical to path_a1_pa_code.yaml. Per V8+ experimentation
# discipline: change one knob at a time.
#
# Resume source: SAME warmstart (V2-derived encoder/decoder + identity-init
# FiLM). Original best.pt deliberately NOT used -- only 1 epoch of FiLM
# divergence, not worth the stale-optimizer-state risk.
#
# Save dir: checkpoints/path_a1_pa_code_lr1e4/  (does NOT touch original).
# =============================================================================

experiment:
  name: "path_a1_pa_code_lr1e4"
  seed: 42
  output_dir: "checkpoints"
  log_dir: "logs"

model:
  architecture: "auto_ode_sam"
  encoder_name: "tiny_vit_21m_224"
  encoder_pretrained: true
  encoder_freeze_backbone: false
  img_size: 256
  embed_dim: 256

  multiscale_isa:
    stage_index: 2

  ode:
    use_pa_code: true
    n_pos_freqs: 4
    ode_hidden: 128
    n_freqs: 6
    substeps: 4
    n_organs: 15
    organ_emb_dim: 64

  pfesa:
    alpha: 1.0
    highfreq_cutoff: 0.5

  isa:
    enabled: false

  organ_query_decoder:
    n_organs: 15
    n_heads: 8
    n_layers: 2
    diversity_loss_weight: 0.01

  organ_decoder:
    transformer_depth: 2
    transformer_mlp_dim: 2048
    iou_head_depth: 3
    iou_head_hidden_dim: 256

data:
  dataset: "amos22_3d"
  data_root: "C:/Users/Raywa/Desktop/LiteSAM3D/data/amos22"
  modality: "ct"
  num_classes: 1
  target_organs: [1, 2, 3, 6]
  clip_range: [-175, 250]
  target_spacing: [1.5, 1.5, 1.5]
  normalize: true
  train_split: "train"
  val_split: "val"
  test_split: "test"
  slices_per_volume: 8
  slice_overlap: 0.5
  cache_rate: 0.0

training:
  epochs: 40
  encoder_freeze_epochs: 5
  batch_size: 2
  grad_accumulation_steps: 8
  num_workers: 4
  pin_memory: true
  mixed_precision: true

  optimizer: "adamw"
  lr: 1.0e-4                      # HALVED from 2.0e-4. Sole knob change vs original.
  lr_min: 1.0e-6
  weight_decay: 0.05
  betas: [0.9, 0.999]

  scheduler: "cosine_warmup"
  warmup_epochs: 3
  warmup_lr_init: 1.0e-6
  grad_clip: 1.0

  encoder_lr_scale: 0.05          # net encoder peak LR = 1e-4 * 0.05 = 5e-6

  all_slice_supervision: true
  cutmix_prob: 0.0
  copypaste_prob: 0.0
  foreground_oversampling: false

  boundary_ramp_epoch: 12

  loss:
    w_dice:         0.5
    w_focal:        0.0
    w_cldice:       0.0
    w_iou:          0.1
    w_boundary:     0.1
    w_dice_topk:    0.5
    w_deepsup:      0.1
    focal_alpha:    0.25
    focal_gamma:    2.0
    cldice_iterations: 3

checkpoint:
  save_every_n_epochs: 1
  keep_top_k: 10
  monitor_metric: "val_dice_3d"
  best_min_delta: 0.005
  # Same warmstart as original run -- clean diagnostic (only LR differs).
  resume_from: "checkpoints/path_a1_pa_code/path_a1_pa_code_warmstart.pt"

validation:
  val_every_n_epochs: 1
  vis_every_n_epochs: 2
  use_val_dice_3d: true
  val_dice_3d_n_vols: 4

evaluation:
  metric_space: "3d_volume"
  report_spacing_mm: [1.5, 1.5, 1.5]
  compute_hd95: true
  compute_nsd: true

cross_validation:
  enabled: false
  n_folds: 5
  fold: 0
  stratify_by: "patient"

logging:
  use_wandb: false
  use_tensorboard: true
  wandb_project: "voluformer3d"
  wandb_entity: null
  log_every_n_steps: 50
  log_images: true
