# configs/v10_voco_h_lora.yaml — Week 3/4 VoCo-H moonshot via LoRA + full decoder.
#
# MOONSHOT CONTEXT:
#   VoCo-H (1.2B params, fs=192) full-FT does NOT fit on 24 GB 4090 (~25-27 GB
#   peak for fwd+bwd+AdamW states). LoRA rank-16 on qkv/proj/MLP (~25-50M
#   trainable) + full decoder FT (~30-50M) fits ~8-12 GB.
#
# EXPECTED:
#   Paper-reported VoCo-H on AMOS22 CT: ~0.88. Under partial-FT (LoRA + decoder)
#   we target 0.86-0.88 in 20 epochs; combined with TTA and ensemble, aims at
#   the 0.90 moonshot.
#
# WEEK 3/4 GATE:
#   After 10 ep, mean 3D Dice ≥ 0.84. After 20 ep, ≥ strictly above best
#   VoCo-L Week-2 result OR ≥ 0.88. Else fall back.
#
# BFLOAT16 REQUIRED:
#   fs=192 activations will overflow fp16 even worse than fs=96. Use bf16.
#   (See feedback_voco_amp_bf16.md in memory.)

experiment:
  name: "v10_voco_h_lora"
  seed: 42
  output_dir: "checkpoints/v10_voco_h_lora"
  log_dir: "logs/v10_voco_h_lora"

model:
  architecture: "voluformer_v9"
  n_organs: 15
  img_size: 320
  embed_dim: 256

  proposer:
    patch_size: 96
    feature_size: 192                                # VoCo-H fs
    use_v2: true
    pretrained_weights: "checkpoints/pretrained/voco/VoComni_H.pt"
    deep_supervision: false
    deep_sup_layers: ["decoder3", "decoder4", "decoder5"]
    # LoRA path: freezes swinViT, injects rank-16 adapters on qkv/proj/fc1/fc2.
    # Decoder + output head stay fully trainable.
    lora_rank: 16
    lora_alpha: 16

  skip_channels: 128
  skip_fine_channels: 64
  encoder: { pretrained: true, lora_rank: 32 }
  pfesa: {}
  ode:
    n_organs: 15
    organ_emb_dim: 32
    ode_hidden: 128
    n_freqs: 6
    substeps: 4
  decoder:
    n_organs: 15
    transformer_depth: 6
    transformer_mlp_dim: 3072
  graph: { n_organs: 15 }

  dynamic_pfesa:
    enabled: false
    kernel_size: 3
    organ_dim: 32
    text_dim: 0
  boundary_ddpm:
    enabled: false
    hidden: 64
    n_timesteps: 100

data:
  dataset: "amos22_v9"
  data_root: "C:/Users/Raywa/Desktop/LiteSAM3D/data/amos22"
  img_size: 320
  depth: 8
  volume_patch: 96
  hu_clip: [-200, 250]
  pos_frac: 0.5
  neg_frac: 0.3
  mix_frac: 0.2
  slabs_per_volume: 4
  copy_paste_prob: 0.0
  copy_paste_cache: "C:/Users/Raywa/Desktop/LiteSAM3D/data/amos22/copy_paste_bank.pt"

training:
  stage: 1
  # 20 ep: LoRA plateaus fast because encoder is frozen and adapters carry
  # little capacity. Re-training decoder is the main driver.
  epochs: 20
  batch_size: 1
  num_workers: 2
  optimizer:
    name: "adamw"
    # 2-5x higher LR than full-FT — LoRA wants it. If unstable, drop to 1e-4.
    lr: 2.0e-4
    weight_decay: 0.01
  scheduler:
    name: "cosine"
    warmup_epochs: 1
  amp: true
  amp_dtype: "bf16"
  grad_clip: 1.0
  loss_small_organ: false
  loss_small_organ_cfg:
    dice_weight: 1.0
    tversky_weight: 1.0
    focal_weight: 0.5
    tversky_alpha: 0.3
    tversky_beta: 0.7
    focal_gamma: 1.5
  deep_sup_weight_start: 0.0
  deep_sup_weight_end: 0.0

loss:
  dice_weight: 1.0
  tversky_weight: 1.0
  xsc_weight: 0.25
  flow_weight: 0.5
  deepsup_weight: 0.25
  teacher_distill: 0.0
  cross_modal_infonce: 0.0
  flow_shape_prior: 0.0
  cascade_consistency_kl: 0.0
  cascade_consistency_dice: 0.0
  boundary_ddpm: 0.0

eval:
  every_n_epochs: 2
  patch_size: 96
  stride: 48
  tta: true
  connected_component: true
  report_per_organ: true

safety:
  abort_if_val_drops: 0.02
  # VoCo-H peaks higher than VoCo-L but should still fit under 20 GB with LoRA.
  max_peak_vram_gb: 22
  warmstart_missing_key_frac: 0.05
