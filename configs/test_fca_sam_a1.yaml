# =============================================================================
# test_fca_sam_a1.yaml — FCA-SAM Test Run: 256px / 20 epochs / Liver only
#
# Architecture: FCA-SAM (FFT cross-slice, n_keep=3 for D=8 slices)
# Same protocol as test_multiscale_isa_a1.yaml for direct comparison.
#
# RUN:
#   python train.py --config configs/test_fca_sam_a1.yaml
# =============================================================================

experiment:
  name: "test_fca_sam_a1_256px_liver"
  seed: 42
  output_dir: "checkpoints"
  log_dir: "logs"

model:
  architecture: "fca_sam"
  encoder_name: "tiny_vit_21m_224"
  encoder_pretrained: true
  encoder_freeze_backbone: false
  img_size: 256
  embed_dim: 256

  multiscale_isa:
    stage_index: 2           # FCA-SAM reuses same Stage 2 encoder

  fca:
    n_keep: 3                # Low-pass: keep DC + first 2 harmonics (D=8 → 5 total bins)

  prompt_encoder:
    num_modalities: 11
    modality_embed_dim: 64
    content_embed_dim: 64
    use_clip_text: false

  mask_decoder:
    num_multimask_outputs: 3
    iou_head_depth: 3
    iou_head_hidden_dim: 256

data:
  dataset: "amos22_3d"
  data_root: "C:/Users/Raywa/Desktop/LiteSAM3D/data/amos22"
  modality: "ct"
  num_classes: 1
  target_organs: [6]
  clip_range: [-175, 250]
  target_spacing: [1.5, 1.5, 1.5]
  normalize: true
  train_split: "train"
  val_split: "val"
  test_split: "test"
  slices_per_volume: 8
  slice_overlap: 0.5
  cache_rate: 0.0

training:
  epochs: 20
  batch_size: 8
  grad_accumulation_steps: 2
  num_workers: 4
  pin_memory: true
  mixed_precision: true
  optimizer: "adamw"
  lr: 1.0e-4
  lr_min: 1.0e-6
  weight_decay: 0.01
  betas: [0.9, 0.999]
  scheduler: "cosine_warmup"
  warmup_epochs: 2
  warmup_lr_init: 1.0e-6
  grad_clip: 1.0
  loss:
    w_dice:   0.5
    w_focal:  0.5
    w_cldice: 0.0
    w_iou:    0.1
    w_boundary: 0.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  cldice_iterations: 3

checkpoint:
  save_every_n_epochs: 5
  keep_top_k: 2
  monitor_metric: "val/dice_3d"
  resume_from: null

validation:
  val_every_n_epochs: 5
  vis_every_n_epochs: 10

evaluation:
  metric_space: "3d_volume"
  report_spacing_mm: [1.5, 1.5, 1.5]
  compute_hd95: true
  compute_nsd: true

cross_validation:
  enabled: false
  n_folds: 5
  fold: 0
  stratify_by: "patient"

logging:
  use_wandb: false
  use_tensorboard: true
  wandb_project: "voluformer3d"
  wandb_entity: null
  log_every_n_steps: 50
  log_images: true
