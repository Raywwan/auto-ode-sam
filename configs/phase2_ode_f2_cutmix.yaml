# =============================================================================
# phase2_ode_f2_cutmix.yaml — Phase 2 Fix 2: All-Slice + CutMix
#
# Adds CutMix augmentation on top of Fix 1.
# Expected gain: +4.9% on AMOS22 (arXiv:2602.03555) — largest single gain.
#
# RUN:
#   cd C:\Users\Raywa\Desktop\VoluFormer3D
#   C:\Users\Raywa\Desktop\LiteSAM3D\.venv\Scripts\python train.py \
#       --config configs/phase2_ode_f2_cutmix.yaml
# =============================================================================

experiment:
  name: "phase2_ode_f2_cutmix_256px_liver"
  seed: 42
  output_dir: "checkpoints"
  log_dir: "logs"

model:
  architecture: "ode_sam"
  encoder_name: "tiny_vit_21m_224"
  encoder_pretrained: true
  encoder_freeze_backbone: false
  img_size: 256
  embed_dim: 256

  multiscale_isa:
    stage_index: 2

  ode:
    ode_hidden: 64
    n_freqs: 4
    substeps: 2

  isa:
    enabled: false

  prompt_encoder:
    num_modalities: 11
    modality_embed_dim: 64
    content_embed_dim: 64
    use_clip_text: false

  mask_decoder:
    num_multimask_outputs: 3
    iou_head_depth: 3
    iou_head_hidden_dim: 256

data:
  dataset: "amos22_3d"
  data_root: "C:/Users/Raywa/Desktop/LiteSAM3D/data/amos22"
  modality: "ct"
  num_classes: 1
  target_organs: [6]
  clip_range: [-175, 250]
  target_spacing: [1.5, 1.5, 1.5]
  normalize: true
  train_split: "train"
  val_split: "val"
  test_split: "test"
  slices_per_volume: 8
  slice_overlap: 0.5
  cache_rate: 0.0

training:
  epochs: 21
  batch_size: 4
  grad_accumulation_steps: 4
  num_workers: 4
  pin_memory: true
  mixed_precision: true
  optimizer: "adamw"
  lr: 1.0e-4
  lr_min: 1.0e-6
  weight_decay: 0.01
  betas: [0.9, 0.999]
  scheduler: "cosine_warmup"
  warmup_epochs: 2
  warmup_lr_init: 1.0e-6
  grad_clip: 1.0

  # Phase 2 flags
  all_slice_supervision: true
  cutmix_prob: 0.5              # 50% of batches get CutMix

  loss:
    w_dice:      0.5
    w_focal:     0.5
    w_cldice:    0.0
    w_iou:       0.1
    w_boundary:  0.0
    w_dice_topk: 0.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  cldice_iterations: 3

checkpoint:
  save_every_n_epochs: 5
  keep_top_k: 2
  monitor_metric: "val/dice_3d"
  resume_from: null

validation:
  val_every_n_epochs: 5
  vis_every_n_epochs: 10

evaluation:
  metric_space: "3d_volume"
  report_spacing_mm: [1.5, 1.5, 1.5]
  compute_hd95: true
  compute_nsd: true

cross_validation:
  enabled: false
  n_folds: 5
  fold: 0
  stratify_by: "patient"

logging:
  use_wandb: false
  use_tensorboard: true
  wandb_project: "voluformer3d"
  wandb_entity: null
  log_every_n_steps: 50
  log_images: true
